name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: check the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          committed="$(jq -r .version package.json)"
          if [ "$committed" != "$version" ]; then
            echo "package.json says ${committed} but the tag says ${version}." >&2
            echo "Cut releases with scripts/release.sh so the two stay in step." >&2
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yaml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download the PDFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: resume-pdf
          path: dist
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pdf --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
